<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>구매 전 확인하세요 | 달문양 인센스 홀더</title>
<style>
/*FONTS*/
/* Coupang "판매자로켓 안내 배너" template (1000px): fixed title image at (24,54), Noto Sans CJK KR Regular 30px,
   tracking -35, leading 44, text #45464d, 8px bullet dots, 1px #e1e6ec rounded frame, 65px inner / 30px outer bottom margin */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;background:#fff}
body{font-family:'Noto Sans KR',sans-serif;color:#45464d;-webkit-font-smoothing:antialiased;word-break:keep-all}
.banner{position:relative;width:1000px;padding-bottom:30px}
.box{position:relative;border:1px solid #e1e6ec;border-radius:8px;padding:122px 45px 60px}
.title{position:absolute;left:23px;top:53px;width:417px;height:63px}
.list{list-style:none}
.list li{position:relative;padding-left:23px;font-size:30px;line-height:44px;letter-spacing:-.035em}
.list li + li{margin-top:18px}
.list li::before{content:"";position:absolute;left:0;top:18px;width:8px;height:8px;border-radius:50%;background:#4e4f57}
.list b{font-weight:700;color:#2b2c31}
.list .note{display:block;margin-top:6px;font-weight:500;color:#e58a00}
.photos{display:flex;gap:20px;margin-top:40px}
.photos figure{flex:1}
.ph{position:relative;height:250px;border-radius:8px;overflow:hidden;background:#f3efe9}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph svg{position:absolute;left:0;top:0}
.tag{position:absolute;padding:7px 14px;border-radius:100px;background:#f89300;color:#fff;font-size:20px;font-weight:700;line-height:1;letter-spacing:-.03em;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.photos figcaption{margin-top:14px;font-size:26px;line-height:36px;letter-spacing:-.035em;color:#45464d}
</style>
</head>
<body>
<div class="banner" id="s-notice-top">
  <div class="box">
    <img class="title" src="../assets/notice-title.png" alt="구매 전 확인하세요">
    <ul class="list">
      <li><b>[수작업 특성]</b> 손으로 하나하나 만드는 제품이라 금색 문양의 위치·크기와 나뭇결·색상이 제품마다 조금씩 다를 수 있습니다.</li>
      <li><b>[유격 발생 가능]</b> 덮개(커버)와 본체, 하단 수납함 사이에 약간의 유격(틈)이 있을 수 있으며, 온도·습도에 따라 여닫을 때 헐겁거나 뻑뻑할 수 있습니다.
        <span class="note">※ 위 두 가지는 제품 불량이 아닌, 수작업 나무 제품의 특성입니다.</span></li>
      <li><b>[사용 시 주의]</b> 스틱이 덮개·본체에 닿지 않도록 홀더 구멍에 단단히 꽂아 주시고, 사용 중에는 자리를 비우지 마세요.</li>
    </ul>
    <div class="photos">
      <figure>
        <div class="ph"><img src="../assets/notice-craft.jpg" alt="금색 해·별 문양 확대">
          <svg width="444" height="250" viewBox="0 0 444 250" fill="none"><circle cx="222" cy="140" r="74" stroke="#f89300" stroke-width="3" stroke-dasharray="9 7"/></svg>
          <span class="tag" style="left:16px;top:16px">수작업 금색 문양</span></div>
        <figcaption>문양·나뭇결은 제품마다 조금씩 달라요</figcaption>
      </figure>
      <figure>
        <div class="ph"><img src="../assets/notice-gap.jpg" alt="덮개와 본체 이음 부분">
          <svg width="444" height="250" viewBox="0 0 444 250" fill="none"><rect x="44" y="97" width="392" height="38" rx="19" stroke="#f89300" stroke-width="3" stroke-dasharray="9 7"/></svg>
          <span class="tag" style="right:16px;top:150px">유격 발생 가능 부위</span></div>
        <figcaption>덮개와 본체 사이 유격(틈)</figcaption>
      </figure>
    </div>
  </div>
</div>
</body>
</html>
